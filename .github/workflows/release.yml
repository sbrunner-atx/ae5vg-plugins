name: Release

# Zips each plugin, for Claude and for ChatGPT, Codex and others, and attaches the zips to the GitHub release
# that triggered this run. The ae5vg.com Downloads page reads the asset list
# from the releases/latest API. In Claude: Customize, Plugins, Add, Upload plugin.
# Fires when you publish a GitHub Release:
#   gh release create vX.Y.Z --title vX.Y.Z --notes-file RELEASE-NOTES.md
# RELEASE-NOTES.md holds the install steps; add a line on what changed before releasing.

on:
  release:
    types: [published]

jobs:
  zips:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # upload release assets
    steps:
      - uses: actions/checkout@v4
      - name: Check that the ChatGPT plugins do not name Claude
        run: |
          if grep -rIn -i claude codex/amateur-radio codex/serial-console; then
            echo "The ChatGPT plugins must not name Claude."; exit 1
          fi
      - name: Check the portable Agent Plugins files are current
        run: python3 scripts/emit_portable.py --check
      - name: Zip the plugins
        run: |
          mkdir dist
          (cd plugins && zip -qr ../dist/amateur-radio-claude-plugin.zip amateur-radio -x '*.DS_Store')
          (cd plugins && zip -qr ../dist/serial-console-claude-plugin.zip serial-console-mcp -x '*.DS_Store')
          # ChatGPT and Codex install only from a marketplace folder, so each ChatGPT zip
          # is a one-plugin marketplace: unzip it, then add the folder as a marketplace.
          python3 scripts/build_chatgpt_zip.py amateur-radio "Amateur Radio"
          python3 scripts/build_chatgpt_zip.py serial-console "Serial Console"
          ls -l dist
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber
